<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pirate Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#ffb627;--p2:#2ed3ff;--parch:#f4e4c1;--ink:#2a1a0e;--gold:#e9b949;--edge:#8a6a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#061420;color:var(--parch);font-family:'Nunito',system-ui,sans-serif}
canvas#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
.sc{font-family:'Lilita One',system-ui,sans-serif}
.panel{background:linear-gradient(180deg,rgba(38,23,11,.88),rgba(16,10,5,.9));border:2px solid var(--edge);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,220,150,.08);backdrop-filter:blur(3px)}
.btn{font-family:'Lilita One',system-ui,sans-serif;font-size:20px;color:var(--ink);background:linear-gradient(180deg,#f3cc6a,#c08a2c);border:2px solid #5a3a12;border-radius:10px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 #5a3a12;transition:transform .08s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3a12}
.btn:disabled{filter:grayscale(.9) brightness(.65);cursor:not-allowed;transform:none}
.btn.small{font-size:15px;padding:4px 10px;box-shadow:0 3px 0 #5a3a12}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--parch);border-color:var(--edge);box-shadow:none}
.btn.big{font-size:38px;padding:8px 54px;letter-spacing:.06em}
.logo{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(52px,8vw,118px);line-height:.95;letter-spacing:.02em;color:#ffe9b8;margin:0;text-align:center;-webkit-text-stroke:2px #3a1f0a;text-shadow:0 5px 0 #3a1f0a,0 9px 0 rgba(0,0,0,.35),0 0 34px rgba(0,0,0,.5)}
.tagline{text-align:center;font-weight:700;font-size:18px;margin-top:6px;text-shadow:0 2px 6px #000}
/* lobby */
#lobby{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px 20px;overflow:auto;pointer-events:none}
#lobby>*{pointer-events:auto}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(16,10,5,.72);border:1.5px solid rgba(233,185,73,.55);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;backdrop-filter:blur(3px)}
.chip b{color:var(--gold);font-weight:800}
#lobbyBottom{display:grid;grid-template-columns:minmax(250px,320px) 1fr minmax(250px,320px);gap:16px;align-items:end}
#lobbyCenter{display:flex;flex-direction:column;align-items:center;gap:10px}
.linkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#hubStatus{font-weight:800;font-size:14px;text-shadow:0 1px 3px #000;text-align:center}
#hubStatus.on{color:#7dff9b}
.textbtn{background:none;border:none;color:var(--parch);font:inherit;font-weight:800;font-size:14px;text-decoration:underline;cursor:pointer;opacity:.9;text-shadow:0 1px 3px #000}
.pcard{padding:10px 12px;border-color:var(--pc)}
.prow{display:flex;align-items:center;gap:8px}
.prow h3{margin:0;font-size:22px;color:var(--pc);flex:1;font-weight:400;font-family:'Lilita One',system-ui,sans-serif}
.mbs{font-size:12px;font-weight:800;opacity:.85}
.mbs.on{color:#7dff9b;opacity:1}
.tilt{width:38px;height:38px;border-radius:50%;border:2px solid var(--pc);position:relative;background:rgba(0,0,0,.35)}
.tilt i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--pc);left:12px;top:12px;box-shadow:0 0 8px var(--pc)}
.ships{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.shipcard{border:2px solid transparent;border-radius:10px;background:rgba(255,255,255,.05);padding:3px;cursor:pointer;text-align:center;font-size:12px;font-weight:700;line-height:1.1;color:var(--parch)}
.shipcard img{width:100%;display:block;aspect-ratio:3/2;object-fit:contain}
.shipcard.sel{border-color:var(--pc);box-shadow:0 0 12px var(--pc);background:rgba(255,255,255,.12)}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin-top:8px}
.setgrid h3{margin:0 0 6px;font-family:'Lilita One',system-ui,sans-serif;font-weight:400}
.setgrid label{display:block;margin:6px 0;font-size:15px}
.ov ul{text-align:left;font-size:16px;line-height:1.45;padding-left:20px}
.ov .small{font-size:14px;opacity:.85}
#tutLeave{pointer-events:auto;margin-top:4px}
@media(max-width:900px){#lobbyBottom{grid-template-columns:1fr}}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}
.pp{position:absolute;top:12px;width:270px;padding:8px 12px;border-color:var(--pc)}
#pp0{left:12px}#pp1{right:12px}
.pp-h{display:flex;justify-content:space-between;align-items:center}
.pname{color:var(--pc);font-size:19px}
.mbdot{font-size:12px;opacity:.85}
.hearts{display:flex;gap:2px;margin:4px 0;min-height:24px}
.hearts svg{width:22px;height:22px}
.hearts .full{color:#ff4a4a;filter:drop-shadow(0 0 3px rgba(255,60,60,.6))}
.hearts .empty{color:rgba(255,255,255,.18)}
.hearts .bonus{color:#ffd85a;filter:drop-shadow(0 0 4px #ffd85a)}
.cds{display:flex;gap:6px}
.cd{flex:1;font-size:12px;position:relative;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;padding:2px 6px}
.cd b{position:absolute;left:0;top:0;bottom:0;background:rgba(233,185,73,.45);z-index:0}
.cd span{position:relative;z-index:1}
.size{font-size:12px;opacity:.8;margin-top:3px}
#roundbox{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:6px 20px;text-align:center;min-width:240px}
#roundTitle{font-size:22px;color:var(--gold)}
#score{font-size:18px}
#score .a{color:var(--p1)}#score .b{color:var(--p2)}
#merTimer{font-size:14px;opacity:.85}
.tut{position:absolute;bottom:14px;width:min(400px,44vw);padding:10px 14px;border-color:var(--pc)}
#tut0{left:12px}#tut1{right:12px}
.tut h4{margin:0;color:var(--pc);font-size:20px}
.tut .step{font-size:13px;opacity:.8}
.tut p{margin:4px 0 6px;font-size:16px}
.tut .bar{height:8px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden}
.tut .bar i{display:block;height:100%;background:var(--pc);width:0}
.tut .dots{display:flex;gap:4px;margin-top:6px}
.tut .dots span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.tut .dots span.on{background:var(--pc)}
.tut .tip{color:#ffd27a;font-size:13px;min-height:16px}
#alert{position:absolute;top:96px;left:50%;transform:translateX(-50%);font-size:24px;color:#ffe27a;text-shadow:0 0 12px rgba(255,220,100,.8),0 2px 3px #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#alert.show{opacity:1}
#banner{position:fixed;left:0;right:0;top:19%;text-align:center;font-size:clamp(40px,7vw,100px);color:#f7e7c0;-webkit-text-stroke:1px #2a170a;text-shadow:0 4px 0 #3a210c,0 0 30px rgba(0,0,0,.8);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:.3em;font-family:'Nunito',system-ui,sans-serif;font-weight:800;-webkit-text-stroke:0}
#labels div{position:fixed;transform:translate(-50%,-100%);padding:1px 8px;border-radius:8px;background:rgba(0,0,0,.5);border:2px solid currentColor;font-family:'Lilita One',system-ui,sans-serif;font-size:15px;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.ov{padding:22px 34px;text-align:center;max-width:560px}
.ov h2{margin:0 0 6px;font-size:42px;font-weight:400;color:var(--gold);font-family:'Lilita One',system-ui,sans-serif}
.ov p{font-size:18px}
.ov table{margin:10px auto;border-collapse:collapse;font-size:16px}
.ov td,.ov th{padding:3px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.ov .row{display:flex;gap:14px;justify-content:center;margin-top:14px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#muteBtn{position:fixed;right:14px;top:14px;z-index:5}
body.ingame #muteBtn{top:auto;right:auto;left:50%;bottom:24px;transform:translateX(-50%)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);padding:8px 16px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6}
#toast.show{opacity:1}
#keysHint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:12px;opacity:.6;pointer-events:none;text-shadow:0 1px 2px #000}
@media(max-width:1000px){.pp{width:210px}}
</style>

<body>
<canvas id="game"></canvas>
<div id="labels"></div>

<div id="lobby">
  <header>
    <h1 class="logo">Pirate Wars</h1>
    <div class="tagline">Two captains. One very hungry Kraken.</div>
    <div class="chips">
      <span class="chip"><b>Tilt</b> to sail</span>
      <span class="chip"><b>A</b> fire left · <b>B</b> fire right</span>
      <span class="chip"><b>5 hits</b> and the Kraken takes you</span>
      <span class="chip"><b>Mermaid</b> = extra life</span>
    </div>
  </header>
  <div id="lobbyBottom">
    <div id="pc0"></div>
    <div id="lobbyCenter">
      <button class="btn big" id="btnPlay">PLAY</button>
      <div class="linkrow"><button class="btn small" id="btnConnect">Connect micro:bit</button><button class="btn small ghost" id="btnTrial">Practice round</button></div>
      <div id="hubStatus">Keyboard mode</div>
      <div class="linkrow"><button class="textbtn" id="btnRules">How to play</button><button class="textbtn" id="btnSettings">Settings</button></div>
    </div>
    <div id="pc1"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="pp panel" id="pp0" style="--pc:var(--p1)"></div>
  <div class="pp panel" id="pp1" style="--pc:var(--p2)"></div>
  <div id="roundbox" class="panel sc"><div id="roundTitle"></div><div id="score"></div><div id="merTimer"></div></div>
  <div class="tut panel hidden" id="tut0" style="--pc:var(--p1)"></div>
  <div class="tut panel hidden" id="tut1" style="--pc:var(--p2)"></div>
  <div id="alert" class="sc"></div>
</div>
<div id="banner" class="sc"></div>
<div id="overlay" class="hidden"><div class="panel ov" id="ovBox"></div></div>
<div id="fade"></div>
<div id="toast" class="panel"></div>
<div id="keysHint">Keys — Captain 1: W A S D, Q / E · Captain 2: arrows, , / . · Esc pause</div>
<button id="muteBtn" class="btn small ghost">♪ Sound on</button>

<script type="module">
import * as THREE from 'three';

   ===================================================================== */

   RENDERER / SCENE
   ===================================================================== */
const canvas = $('#game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 2200);
const camPos = new V3(0, 40, 80), camTarget = new V3(0, 0, 0);
let shake = 0;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight('#d8f3ff', '#2a9d8f', 1.35); scene.add(hemi);

/* ---------- sky ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },

const glowTex = canvasTex(128, 128, (c) => { const g = c.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,.95)'); g.addColorStop(0.35, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 128, 128); });

  fog: true,

    uTime: { value: 0 }, uAmp: { value: 0.5 }, uChop: { value: 0.2 },

    uniform float uTime, uAmp, uChop;

const keys = new Set(), kbFire = [{ L: 0, R: 0 }, { L: 0, R: 0 }];

function tutorialUpdate(dt, inp) {
  for (const o of tutObjs) {
    if (o.barrel) { o.mesh.position.y = waveH(o.mesh.position.x, o.mesh.position.z) + 0.3; o.mesh.rotation.z = Math.sin(G.time * 2 + o.owner) * 0.12; }
    if (o.ring) o.mesh.position.y = 3.2 + Math.sin(G.time * 2) * 0.3;
  }
  [0, 1].forEach((i) => {
    const s = tut[i], sh = ships[i]; if (s.done) return;
    if (s.step === 0 && inp[i].fireL) { links[i].calibrate(); tutAdvance(i); return; }
    if (s.step === 1) { if (sh.speed > 1) s.dist += sh.speed * dt; s.prog = s.dist / 30; }
    if (s.step === 2) { s.turn += Math.abs(angleDiff(s.lastH, sh.heading)); s.lastH = sh.heading; s.prog = s.turn / TAU; }
    if (s.step === 3) { const r = tutObjs.find((o) => o.owner === i && o.ring); if (r && Math.hypot(sh.pos.x - r.mesh.position.x, sh.pos.z - r.mesh.position.z) < 4.5 * sh.scale) { fxSparkle(r.mesh.position); tutAdvance(i); return; } }
    const bar = document.querySelector(`#tut${i} .bar i`); if (bar) bar.style.width = `${clamp(s.prog, 0, 1) * 100}%`;
    if ((s.step === 1 || s.step === 2) && s.prog >= 1) tutAdvance(i);
  });
}
function finishTutorial() {
  G.state = 'tutDone'; audio.fanfare();
  setTimeout(() => {
    overlay(`<h2>Practice Complete!</h2><p>Both captains are ready.</p><div class="row"><button class="btn ghost" id="ovHarbour">Harbour</button><button class="btn" id="ovPlay">Start the battle</button></div>`);
    $('#ovHarbour').onclick = () => fadeThrough(enterLobby); $('#ovPlay').onclick = () => fadeThrough(startGame);
  }, 900);
}

/* ---------- battle flow ---------- */
function startGame() { G.wins = [0, 0]; resetStats(); startRound(0); }
function startRound(r) {
  G.round = r; G.state = 'intro'; G.timer = 0; G.merT = 30; G.landed = 0;
  closeOverlay(); clearBalls(); clearTut(); kraken.hide(); mermaid.hide();
  $('#lobby').classList.add('hidden'); $('#hud').classList.remove('hidden'); $('#tut0').classList.add('hidden'); $('#tut1').classList.add('hidden'); $('#keysHint').classList.remove('hidden'); document.body.classList.add('ingame');
  setEnv(ROUNDS[r].env); audio.setMode(ROUNDS[r].music);
  ships[0].reset(-28, 0, 0); ships[1].reset(28, 0, Math.PI);
  ships[0].drop(58); ships[1].drop(66);
  hudHeader(); setRoundBox();
  banner(`Round ${r + 1} — ${ROUNDS[r].title}`, ROUNDS[r].sub, 2600); audio.whoosh();
}
function onSink(loser, winner) {
  loser.alive = false; G.state = 'kraken'; clearBalls(); mermaid.hide(); audio.setMode('kraken'); $('#alert').classList.remove('show');
  loser.sinking = true; loser.ring.visible = false;
  links[loser.idx].send('S');
  banner('KRAKEN!', `Captain ${loser.idx + 1} is going down`, 1800);
  kraken.grab(loser, () => roundEnd(winner));
}
function roundEnd(w) {
  G.wins[w.idx]++; G.state = 'roundEnd'; G.timer = 0; links[w.idx].send('W'); audio.fanfare(); setRoundBox();
  const last = G.round >= 2;
  overlay(`<h2 style="color:${PCOL[w.idx]}">Captain ${w.idx + 1} takes Round ${G.round + 1}!</h2>
    <p class="sc" style="font-size:24px"><span style="color:${PCOL[0]}">Captain 1: ${G.wins[0]}</span> &nbsp;⚔&nbsp; <span style="color:${PCOL[1]}">Captain 2: ${G.wins[1]}</span></p>
    <p>${last ? 'The final tally awaits…' : `Next stop: <b>${ROUNDS[G.round + 1].title}</b>`}</p><p style="font-size:14px;opacity:.8">Press any fire button to continue</p>`);
}
function nextAfterRound() { if (G.round >= 2) gameOver(); else fadeThrough(() => startRound(G.round + 1)); }
function gameOver() {
  G.state = 'over'; const w = G.wins[0] > G.wins[1] ? 0 : 1; audio.setMode('lobby'); audio.fanfare();
  const row = (k, f) => `<tr><td>${k}</td><td style="color:${PCOL[0]}">${f(0)}</td><td style="color:${PCOL[1]}">${f(1)}</td></tr>`;
  overlay(`<h2 style="color:${PCOL[w]}">Captain ${w + 1} Rules the Seas!</h2><p>${DESIGNS[ships[w].design].name} wins ${G.wins[w]} – ${G.wins[1 - w]}</p>
    <table><tr><th></th><th>Captain 1</th><th>Captain 2</th></tr>
    ${row('Rounds won', (i) => G.wins[i])}${row('Broadsides fired', (i) => G.stats[i].shots)}${row('Hits landed', (i) => G.stats[i].hits)}
    ${row('Accuracy', (i) => G.stats[i].shots ? Math.round(G.stats[i].hits / G.stats[i].shots * 100) + '%' : '—')}${row('Mermaids caught', (i) => G.stats[i].mermaids)}</table>
    <div class="row"><button class="btn" id="ovRe">Rematch</button><button class="btn ghost" id="ovHome">Harbour</button></div>`);
  $('#ovRe').onclick = () => fadeThrough(startGame); $('#ovHome').onclick = () => fadeThrough(enterLobby);
}
function togglePause() {
  if (!['battle', 'tutorial', 'intro', 'countdown'].includes(G.state)) return;
  G.paused = !G.paused;
  if (G.paused) {
    overlay(`<h2>Paused</h2><p>Drop anchor, catch your breath.</p><div class="row"><button class="btn" id="ovRes">Resume</button><button class="btn ghost" id="ovQuit">Quit to Harbour</button></div>`);
    $('#ovRes').onclick = togglePause; $('#ovQuit').onclick = () => { G.paused = false; fadeThrough(enterLobby); };
  } else closeOverlay();
}
function spawnMermaid() {
  const a = ships[0].pos, b = ships[1].pos, mid = a.clone().add(b).multiplyScalar(0.5);
  const perp = new V3(-(b.z - a.z), 0, b.x - a.x).normalize();
  let p = null;
  for (let k = 0; k < 20; k++) {
    const c = mid.clone().addScaledVector(perp, rand(-22, 22)); const l = c.length(); if (l > 46) c.multiplyScalar(46 / l);
    if (ENVS[G.env].colliders.every((o) => Math.hypot(c.x - o.x, c.z - o.z) > o.r + 6)) { p = c; break; }
  }
  if (!p) p = new V3(0, 0, 0);
  mermaid.spawn(p); audio.chime(); showAlert('A mermaid leaps from the sea! First to reach her gains a life!', 3500);
}
function collideShips() {
  const env = ENVS[G.env];
  for (const s of ships) {
    if (!s.alive || s.sinking || s.dropping) continue;
    const r = s.hitRadius();
    for (const c of env.colliders) {
      const dx = s.pos.x - c.x, dz = s.pos.z - c.z, d = Math.hypot(dx, dz) || 0.001, m = c.r + r;
      if (d < m) { s.pos.x += dx / d * (m - d); s.pos.z += dz / d * (m - d); if (Math.abs(s.speed) > 5) { s.flash = Math.max(s.flash, 0.3); audio.splash(false); } s.speed *= 0.55; }
    }
    const d = Math.hypot(s.pos.x, s.pos.z), lim = ARENA - r;
    if (d > lim) { s.pos.x *= lim / d; s.pos.z *= lim / d; s.speed *= 0.9; }
  }
  const [a, b] = ships;
  if (a.alive && b.alive && !a.dropping && !b.dropping) {
    const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz) || 0.001, m = a.hitRadius() + b.hitRadius();
    if (d < m) { const p = (m - d) / 2; a.pos.x -= dx / d * p; a.pos.z -= dz / d * p; b.pos.x += dx / d * p; b.pos.z += dz / d * p; a.speed *= 0.7; b.speed *= 0.7; }
  }
}

/* =====================================================================
   CAMERA
   ===================================================================== */
function updateCamera(dt) {
  const des = new V3(), tgt = new V3();
  if (G.state === 'lobby') { des.set(Math.sin(G.time * 0.12) * 5, 10.5, 50); tgt.set(0, 7, -12); }
  else if (G.state === 'kraken' || (G.state === 'roundEnd' && kraken.ship && G.timer < 0.5)) {
    const s = kraken.ship || ships[0], sc = s.scale, a = (kraken.camA || 0) + Math.sin(G.time * 0.3) * 0.15, hd = 24 * sc + 12;
    tgt.set(s.pos.x, 5 * sc, s.pos.z);
    des.set(s.pos.x + Math.sin(a) * hd, 13 * sc + 9, s.pos.z + Math.cos(a) * hd);
  } else {
    const live = ships.filter((s) => s.root.visible);
    const a = live[0] || ships[0], b = live[1] || a;
    const mid = a.root.position.clone().add(b.root.position).multiplyScalar(0.5);
    const dist = Math.hypot(a.pos.x - b.pos.x, a.pos.z - b.pos.z), d = clamp(dist * 0.8 + 24, 34, 108);
    tgt.set(mid.x, 2 + Math.max(0, mid.y) * 0.45, mid.z);
    des.set(mid.x, d * 0.72 + Math.max(0, mid.y) * 0.3, mid.z + d * 0.8);
  }
  const k = 1 - Math.exp(-2.4 * dt); camPos.lerp(des, k); camTarget.lerp(tgt, k);
  camera.position.copy(camPos);
  if (shake > 0) { camera.position.add(_v.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake)); shake = Math.max(0, shake - dt * 2.2); }
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(sunDirV, 900);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function update(dt) {
  G.time += dt; G.timer += dt; W.t += dt * W.speed; waterMat.uniforms.uTime.value = W.t;
  ENVS[G.env].update(dt, G.time);
  for (const b of buoys) { const u = b.userData; b.position.set(u.x, waveH(u.x, u.z) - 0.2, u.z); b.rotation.z = Math.sin(G.time * 1.6 + u.x) * 0.12; }
  const inp = [readInput(0), readInput(1)];
  const ctrl = G.state === 'battle' || G.state === 'tutorial';
  ships.forEach((s, i) => {
    s.update(dt, inp[i], ctrl);
    if (ctrl && s.alive && !s.sinking) { if (inp[i].fireL) fire(s, -1); if (inp[i].fireR) fire(s, 1); }
  });
  if (ctrl || G.state === 'countdown') collideShips();
  updateBalls(dt);
  switch (G.state) {
    case 'intro':
      if (!ships[0].dropping && !ships[1].dropping) { G.landed += dt; if (G.landed > 1.0) { G.state = 'countdown'; G.cd = 3; G.timer = 0; banner('3', '', 800); audio.drum(); } }
      break;
    case 'countdown':
      if (G.timer >= 1) {
        G.timer = 0; G.cd--;
        if (G.cd > 0) { banner(String(G.cd), '', 800); audio.drum(); }
        else { banner('FIRE!', '', 1000); audio.drum(true); G.state = 'battle'; links.forEach((l) => l.send('G')); }
      }
      break;
    case 'battle':
      G.merT -= dt;
      if (G.merT <= 0) { G.merT = 30; spawnMermaid(); }
      if (mermaid.mode === 'jump') {
        const mp = mermaid.pos2();
        for (const s of ships) {
          if (!s.alive || s.sinking) continue;
          if (Math.hypot(s.pos.x - mp.x, s.pos.z - mp.z) < s.hitRadius() + 2.5) {
            s.hp = Math.min(8, s.hp + 1); G.stats[s.idx].mermaids++; fxSparkle(new V3(mp.x, 3, mp.z), 40); audio.chime();
            links[s.idx].send('M'); showAlert(`Captain ${s.idx + 1} caught the mermaid! +1 life`, 3000); mermaid.hide(); break;
          }
        }
      }
      break;
    case 'tutorial': tutorialUpdate(dt, inp); break;
    case 'roundEnd':
      if (G.timer > 2 && (inp[0].fireL || inp[0].fireR || inp[1].fireL || inp[1].fireR)) { G.timer = -99; nextAfterRound(); }
      else if (G.timer > 7) { G.timer = -99; nextAfterRound(); }
      break;
  }
  mermaid.update(dt); kraken.update(dt); FX.update(dt); refreshLinkUI();
  updateCamera(dt); updateLabels();
  if (G.state === 'lobby') updateTiltPads(); else if (!$('#hud').classList.contains('hidden')) hudUpdate();
}
$('#overlay').addEventListener('click', (e) => { if (G.state === 'roundEnd' && G.timer > 1 && e.target.id === 'overlay') { G.timer = -99; nextAfterRound(); } });

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  try { if (!G.paused) update(dt); } catch (e) { console.error(e); }
  renderer.render(scene, camera);
});
markKeep(ships[0]); markKeep(ships[1]);
enterLobby();
camPos.set(0, 10.5, 50);
window.__PW = { G, ships, links, hub, camera, renderer, scene, W, startTutorial, startGame, startRound, enterLobby, forceSink: () => onSink(ships[1], ships[0]), sim: (sec) => { for (let t = 0; t < sec; t += 1 / 30) update(1 / 30); } };
</script>
</body>
